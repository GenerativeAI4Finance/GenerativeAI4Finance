name: G4F-WM-010 checks

on:
  push:
    branches:
      - main
      - g4f-wm-010-calibration
    paths:
      - 01-world-models/evaluation/G4F-WM-010/**
      - .github/workflows/g4f-wm-010.yml
  pull_request:
    paths:
      - 01-world-models/evaluation/G4F-WM-010/**
      - .github/workflows/g4f-wm-010.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: 01-world-models/evaluation/G4F-WM-010
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            01-world-models/evaluation/G4F-WM-010/requirements.txt
            01-world-models/evaluation/G4F-WM-010/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all tests
        run: python -m pytest -q
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check runtime source types
        run: python -m mypy
