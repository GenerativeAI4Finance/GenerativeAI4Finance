name: G4F-EDD-010

on:
  push:
    branches: [main, g4f-edd-010-audit-trail]
    paths:
      - 07-applications/enhanced-due-diligence/G4F-EDD-010/**
      - .github/workflows/g4f-edd-010.yml
  pull_request:
    paths:
      - 07-applications/enhanced-due-diligence/G4F-EDD-010/**
      - .github/workflows/g4f-edd-010.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-trail:
    name: Audit trail (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: 07-applications/enhanced-due-diligence/G4F-EDD-010
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.0
      - name: Run all audit trail tests
        run: python -m pytest tests -q
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
