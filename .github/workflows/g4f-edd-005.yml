name: G4F-EDD-005 entity resolution

on:
  push:
    branches: [main, g4f-edd-005-entity-resolution]
    paths:
      - '07-applications/enhanced-due-diligence/G4F-EDD-005/**'
      - '.github/workflows/g4f-edd-005.yml'
  pull_request:
    paths:
      - '07-applications/enhanced-due-diligence/G4F-EDD-005/**'
      - '.github/workflows/g4f-edd-005.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g4f-edd-005-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: 07-applications/enhanced-due-diligence/G4F-EDD-005
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 07-applications/enhanced-due-diligence/G4F-EDD-005/requirements.txt
      - name: Install task dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.0
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
