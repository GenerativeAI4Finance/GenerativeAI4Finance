name: G4F-WM-008 checks

on:
  push:
    branches:
      - main
      - g4f-wm-008-splits-leakage
    paths:
      - "01-world-models/benchmark-splits/G4F-WM-008/**"
      - ".github/workflows/g4f-wm-008.yml"
  pull_request:
    paths:
      - "01-world-models/benchmark-splits/G4F-WM-008/**"
      - ".github/workflows/g4f-wm-008.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
        working-directory: 01-world-models/benchmark-splits/G4F-WM-008
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01-world-models/benchmark-splits/G4F-WM-008/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.0
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run all tests with warnings treated as errors
        run: python -m pytest -W error
